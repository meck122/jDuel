<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jDuel — Speed Battle</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<style>
@keyframes confettiFall {
  0%   { top:-30px; opacity:1; transform:rotate(0deg) translateX(0); }
  25%  { transform:rotate(180deg) translateX(12px); }
  50%  { transform:rotate(360deg) translateX(-8px); }
  75%  { transform:rotate(540deg) translateX(6px); opacity:.8; }
  100% { top:110%; opacity:0; transform:rotate(720deg) translateX(0); }
}
@keyframes bounce    { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
@keyframes cardSlideUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
@keyframes formReveal  { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeIn      { from{opacity:0} to{opacity:1} }
@keyframes countdownPop { 0%{opacity:0;transform:scale(.4)} 40%{opacity:1;transform:scale(1.08)} 70%{transform:scale(.96)} 100%{opacity:1;transform:scale(1)} }
@keyframes countdownFade { 0%{opacity:1;transform:scale(1)} 80%{opacity:0;transform:scale(1.5)} 100%{opacity:0} }
@keyframes timesUpSlam { 0%{opacity:0;transform:scale(2)} 30%{opacity:1;transform:scale(.95)} 55%{transform:scale(1.03)} 100%{opacity:1;transform:scale(1)} }
@keyframes timerPulse  { 0%,100%{opacity:1} 50%{opacity:.55} }
@keyframes cooldownRing { from{stroke-dashoffset:0} to{stroke-dashoffset:195} }
@keyframes pulseGlow   { 0%,100%{box-shadow:0 0 0px rgba(251,191,36,0)} 50%{box-shadow:0 0 24px rgba(251,191,36,.5)} }
@keyframes slideInRight { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:translateX(0)} }
@keyframes scoreFlash  { 0%{transform:scale(1)} 40%{transform:scale(1.25);color:var(--teal)} 100%{transform:scale(1)} }

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --bg0: rgb(18,16,28);   --bg1: rgb(26,24,38);   --bg2: rgb(34,32,48);   --bg3: rgb(42,40,58);
  --fg:  rgb(235,235,235); --fg2: rgba(235,235,235,.7); --fg3: rgba(235,235,235,.5); --fg4: rgba(235,235,235,.25);
  --purple: rgb(139,92,246); --purple-l: rgb(167,139,250); --purple-d: rgb(87,53,192);
  --teal:   rgb(45,212,191); --teal-l:   rgb(94,234,212);
  --gold:   rgb(251,191,36); --gold-l:   rgb(253,216,99);
  --green:  rgb(34,197,94);  --green-d:  rgb(22,163,74);
  --red:    rgb(239,68,68);  --red-l:    rgb(248,113,113);
  --warn:   rgb(251,146,60);
  --border: rgba(235,235,235,.2); --border-s: rgba(235,235,235,.1);
  --grad-purple: linear-gradient(135deg,var(--purple),var(--purple-d));
  --grad-teal:   linear-gradient(135deg,var(--teal),var(--teal-l));
  --grad-pt:     linear-gradient(135deg,var(--purple),var(--teal));
  --grad-gold:   linear-gradient(135deg,var(--gold),var(--gold-l));
  --grad-green:  linear-gradient(135deg,var(--green-d),var(--green));
  --glow-p: 0 0 20px rgba(139,92,246,.35);
  --glow-t: 0 0 20px rgba(45,212,191,.3);
  --glow-g: 0 0 20px rgba(251,191,36,.4);
  --shadow: 0 10px 15px -3px rgba(0,0,0,.5);
  --ease: cubic-bezier(.4,0,.2,1);
  --r-sm:.25rem; --r-md:.5rem; --r-lg:.75rem; --r-xl:1rem; --r-full:9999px;
  --nav:56px;
  --font-d:"Bebas Neue",sans-serif;
  --font-m:"JetBrains Mono",monospace;
}
html,body,#root { width:100%; min-height:100vh; }
body {
  font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color: var(--fg2);
  background: radial-gradient(ellipse at center, rgb(22,18,36) 0%, rgb(16,14,26) 50%, rgb(10,9,16) 100%);
  -webkit-font-smoothing:antialiased;
}
body::after {
  content:""; position:fixed; inset:0; pointer-events:none; z-index:9999;
  background: repeating-linear-gradient(0deg,transparent 0px,transparent 2px,rgba(0,0,0,.04) 2px,rgba(0,0,0,.04) 4px);
}
button { border:none; cursor:pointer; font-family:var(--font-d); letter-spacing:1.5px; text-transform:uppercase; transition:all 250ms var(--ease); }
button:active { transform:translateY(0) !important; }
input { font-family:system-ui,-apple-system,sans-serif; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ── MOCK DATA ─────────────────────────────────────────────── */
const PLAYERS = ["Alex","Jordan","Sam","Riley"];
const QUESTIONS = [
  { text:"What is the chemical symbol for gold?", category:"Science", options:["Go","Ag","Au","Gd"], answer:"Au" },
  { text:"How many bones are in the adult human body?", category:"Biology", options:["196","206","216","226"], answer:"206" },
  { text:"What year did the Berlin Wall fall?", category:"History", options:["1987","1988","1989","1990"], answer:"1989" },
  { text:"Which planet has the most moons?", category:"Astronomy", options:["Jupiter","Saturn","Uranus","Neptune"], answer:"Saturn" },
  { text:"What is the capital of Australia?", category:"Geography", options:["Sydney","Melbourne","Brisbane","Canberra"], answer:"Canberra" },
  { text:"Who wrote '1984'?", category:"Literature", options:["Aldous Huxley","George Orwell","Ray Bradbury","Philip K. Dick"], answer:"George Orwell" },
  { text:"What is the speed of light in km/s?", category:"Physics", options:["200,000","250,000","300,000","350,000"], answer:"300,000" },
  { text:"In what year was the first iPhone released?", category:"Tech", options:["2005","2006","2007","2008"], answer:"2007" },
];

/* ── SHARED UI ─────────────────────────────────────────────── */
const inputSx = {
  width:"100%", padding:"12px 16px", fontSize:"16px",
  borderRadius:"var(--r-md)", border:"2px solid var(--border)",
  background:"var(--bg1)", color:"var(--fg)", outline:"none",
  transition:"all 250ms var(--ease)",
};

function Btn({ gradient, variant, children, disabled, onClick, style={} }) {
  const [hov, setHov] = useState(false);
  let bg, color="var(--fg)", border="none", shadow="none";
  if (gradient==="purple") { bg="var(--grad-purple)"; shadow=hov?"var(--glow-p)":"none"; }
  else if (gradient==="gold") { bg="var(--grad-gold)"; shadow=hov?"var(--glow-g)":"none"; }
  else if (variant==="ghost") { bg="transparent"; border="1px solid var(--border)"; color="var(--fg2)"; }
  else if (variant==="outline") { bg="transparent"; border="2px solid var(--purple)"; color="var(--purple)"; }
  return (
    <button onClick={disabled?undefined:onClick} disabled={disabled}
      onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{ background:bg, color, border, borderRadius:"var(--r-md)", padding:"10px 24px", fontSize:"15px",
        fontFamily:"var(--font-d)", letterSpacing:"1.5px", textTransform:"uppercase",
        cursor:disabled?"not-allowed":"pointer", opacity:disabled?.5:1,
        transform:hov&&!disabled?"translateY(-2px)":"none",
        boxShadow:disabled?"none":shadow, filter:hov&&!disabled&&gradient?"brightness(1.08)":"none",
        transition:"all 250ms var(--ease)", ...style,
      }}>{children}</button>
  );
}

function Toggle({ value:init, onChange }) {
  const [on,setOn] = useState(init);
  function handle() { const v=!on; setOn(v); onChange&&onChange(v); }
  return (
    <div onClick={handle} style={{ width:44,height:24,background:on?"var(--purple)":"var(--bg3)",borderRadius:12,cursor:"pointer",position:"relative",transition:"background 250ms var(--ease)",flexShrink:0 }}>
      <div style={{ position:"absolute",top:3,left:on?22:3,width:18,height:18,background:"white",borderRadius:"50%",transition:"left 250ms var(--ease)",boxShadow:"0 1px 4px rgba(0,0,0,.3)" }}></div>
    </div>
  );
}

/* ── NAV ───────────────────────────────────────────────────── */
function Nav({ onHome }) {
  return (
    <nav style={{ position:"fixed",top:0,left:0,right:0,height:"var(--nav)",
      background:"linear-gradient(90deg,rgb(26,24,38),rgb(34,32,48))",
      boxShadow:"0 4px 12px rgba(0,0,0,.4)", borderBottom:"1px solid rgba(139,92,246,.2)",
      display:"flex",alignItems:"center",padding:"0 20px",zIndex:200 }}>
      <button onClick={onHome} style={{ background:"none",color:"var(--fg)",fontFamily:"var(--font-d)",fontSize:"1.6rem",letterSpacing:".15em",padding:0,border:"none" }}>
        <span style={{color:"var(--purple)"}}>j</span><span style={{color:"var(--gold)"}}>Duel</span>
      </button>
    </nav>
  );
}

/* ── SPEED BATTLE BADGE ────────────────────────────────────── */
function SBBadge({ style={} }) {
  return (
    <span style={{ fontFamily:"var(--font-d)", fontSize:"11px", letterSpacing:"1.5px",
      background:"linear-gradient(135deg,rgba(251,191,36,.18),rgba(251,191,36,.08))",
      border:"1px solid rgba(251,191,36,.5)", color:"var(--gold)",
      padding:"3px 10px", borderRadius:"var(--r-full)", whiteSpace:"nowrap", ...style }}>
      ⚡ Speed Battle
    </span>
  );
}

/* ── LOBBY ─────────────────────────────────────────────────── */
function LobbyPage({ onStart }) {
  const [gameMode, setGameMode] = useState("speed"); // "classic" | "speed"
  const [mc, setMc] = useState(true);
  const [copied, setCopied] = useState(false);
  const players = ["Alex (You)","Jordan","Sam","Riley"];

  return (
    <div style={{ paddingTop:"calc(var(--nav) + 16px)", padding:"calc(var(--nav) + 16px) 20px 40px", display:"flex", justifyContent:"center" }}>
      <div style={{ width:"100%", maxWidth:"820px", display:"flex", gap:"20px", flexWrap:"wrap", alignItems:"flex-start" }}>

        {/* Main card */}
        <div style={{ flex:"1 1 420px", background:"var(--bg1)", border:"2px solid var(--border)", borderRadius:"var(--r-lg)", padding:"28px", boxShadow:"var(--shadow)" }}>
          {/* Header */}
          <div style={{ textAlign:"center", marginBottom:"24px", paddingBottom:"18px", borderBottom:"2px solid var(--purple)" }}>
            <div style={{ fontFamily:"var(--font-d)", fontSize:"clamp(28px,5vw,48px)", color:"var(--purple)", letterSpacing:"4px", marginBottom:"4px", textShadow:"0 2px 12px rgba(139,92,246,.4)" }}>Room XK7M2A</div>
            <span style={{ fontFamily:"var(--font-d)", color:"var(--fg3)", fontSize:"16px", letterSpacing:"1px" }}>{players.length} Players Joined</span>
          </div>

          {/* Share link */}
          <div style={{ background:"var(--bg2)", border:"2px solid var(--border)", borderRadius:"var(--r-md)", padding:"14px 18px", marginBottom:"22px" }}>
            <p style={{ fontFamily:"var(--font-d)", color:"var(--fg3)", fontSize:"11px", letterSpacing:"1px", marginBottom:"8px" }}>Invite friends:</p>
            <div style={{ display:"flex", gap:"8px", alignItems:"center" }}>
              <code style={{ flex:1, background:"var(--bg0)", padding:"7px 10px", borderRadius:"var(--r-sm)", fontFamily:"var(--font-m)", fontSize:"11px", color:"var(--purple)", wordBreak:"break-all" }}>jduel.app/?join=XK7M2A</code>
              <Btn variant="ghost" onClick={()=>{ setCopied(true); setTimeout(()=>setCopied(false),2000); }} style={{ whiteSpace:"nowrap", padding:"7px 12px", fontSize:"11px" }}>
                {copied ? "✓ Copied!" : "📋 Copy"}
              </Btn>
            </div>
          </div>

          {/* Players */}
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(100px,1fr))", gap:"10px", marginBottom:"22px" }}>
            {players.map((p,i) => {
              const isMe = i===0, isHost = i===0;
              return (
                <div key={p} style={{ background:isMe?"rgba(139,92,246,.1)":"var(--bg2)", border:`${isMe?3:2}px solid ${isMe?"var(--purple)":"var(--border)"}`, borderRadius:"var(--r-md)", padding:"10px 6px", display:"flex", flexDirection:"column", alignItems:"center", gap:"5px", boxShadow:isMe?"var(--glow-p)":"none" }}>
                  <div style={{ width:32,height:32,background:"var(--bg3)",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"14px",border:"2px solid var(--border-s)" }}>👤</div>
                  <span style={{ color:"var(--fg)", fontSize:"12px", fontWeight:600, textAlign:"center", lineHeight:1.2 }}>{p}</span>
                  {isHost && <span style={{ fontFamily:"var(--font-d)", fontSize:"9px", color:"var(--gold)", letterSpacing:"1px" }}>Host</span>}
                </div>
              );
            })}
          </div>

          {/* Start */}
          <div style={{ textAlign:"center", paddingTop:"18px", borderTop:"2px solid var(--border)" }}>
            <Btn gradient="gold" onClick={onStart} style={{ padding:"13px 0", fontSize:"20px", letterSpacing:"3px", color:"rgb(14,12,22)", width:"100%" }}>
              {gameMode==="speed" ? "⚡ Start Speed Battle" : "Start Game"}
            </Btn>
          </div>
        </div>

        {/* Settings panel */}
        <div style={{ flex:"0 0 210px", background:"var(--bg1)", border:"2px solid var(--border)", borderRadius:"var(--r-lg)", padding:"22px", alignSelf:"flex-start", boxShadow:"var(--shadow)" }}>
          <div style={{ fontFamily:"var(--font-d)", color:"var(--purple)", fontSize:"18px", letterSpacing:"1px", marginBottom:"20px" }}>Game Settings</div>

          {/* Difficulty */}
          <div style={{ marginBottom:"18px" }}>
            <div style={{ fontFamily:"var(--font-d)", fontSize:"11px", color:"var(--fg3)", letterSpacing:"1px", marginBottom:"8px" }}>Difficulty</div>
            <SegControl options={["Enjoyer","Master","Beast"]} init="Enjoyer" accent="teal" />
          </div>

          {/* Multiple Choice */}
          <div style={{ marginBottom:"20px" }}>
            <div style={{ fontFamily:"var(--font-d)", fontSize:"11px", color:"var(--fg3)", letterSpacing:"1px", marginBottom:"8px" }}>Multiple Choice</div>
            <Toggle value={mc} onChange={setMc} />
          </div>

          {/* Divider */}
          <div style={{ height:"1px", background:"var(--border-s)", margin:"4px 0 18px" }}></div>

          {/* Game Mode — NEW */}
          <div>
            <div style={{ fontFamily:"var(--font-d)", fontSize:"11px", color:"var(--fg3)", letterSpacing:"1px", marginBottom:"10px" }}>Game Mode</div>
            <div style={{ display:"flex", flexDirection:"column", gap:"6px" }}>
              {[["classic","Classic"],["speed","Speed Battle"]].map(([val,label])=>(
                <button key={val} onClick={()=>setGameMode(val)} style={{
                  display:"flex", alignItems:"center", gap:"10px",
                  padding:"9px 12px", borderRadius:"var(--r-md)",
                  background: gameMode===val ? (val==="speed"?"rgba(251,191,36,.1)":"rgba(139,92,246,.12)") : "var(--bg2)",
                  border:`2px solid ${gameMode===val ? (val==="speed"?"rgba(251,191,36,.6)":"var(--purple)") : "var(--border)"}`,
                  cursor:"pointer", textAlign:"left", transition:"all 200ms var(--ease)",
                  boxShadow: gameMode===val ? (val==="speed"?"0 0 12px rgba(251,191,36,.2)":"var(--glow-p)") : "none",
                }}>
                  <span style={{ fontSize:"15px" }}>{val==="speed"?"⚡":"🎮"}</span>
                  <span style={{ fontFamily:"var(--font-d)", fontSize:"13px", letterSpacing:"1px", color: gameMode===val ? (val==="speed"?"var(--gold)":"var(--purple-l)") : "var(--fg3)" }}>{label}</span>
                </button>
              ))}
            </div>

            {/* Rules blurb */}
            {gameMode==="speed" && (
              <div style={{ marginTop:"12px", padding:"10px 12px", background:"rgba(251,191,36,.06)", border:"1px solid rgba(251,191,36,.25)", borderRadius:"var(--r-md)", animation:"formReveal .35s var(--ease) both" }}>
                <p style={{ fontFamily:"var(--font-d)", fontSize:"10px", color:"var(--fg3)", letterSpacing:".5px", lineHeight:1.7 }}>
                  3-minute race — answer as many as you can. Wrong answers lock you for 5s and reveal the correct answer.
                </p>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function SegControl({ options, init, accent="purple" }) {
  const [sel,setSel] = useState(init);
  const ac = accent==="teal" ? "var(--teal)" : "var(--purple)";
  return (
    <div style={{ display:"flex", background:"var(--bg2)", borderRadius:"var(--r-md)", padding:"2px", gap:"2px" }}>
      {options.map(o => (
        <button key={o} onClick={()=>setSel(o)} style={{
          flex:1, padding:"5px 0", fontSize:"10px", letterSpacing:".5px",
          background:sel===o?"rgba(139,92,246,.2)":"transparent", color:sel===o?ac:"var(--fg3)",
          borderRadius:"calc(var(--r-md) - 2px)", fontFamily:"var(--font-d)", border:"none",
        }}>{o}</button>
      ))}
    </div>
  );
}

/* ── COUNTDOWN OVERLAY ─────────────────────────────────────── */
function CountdownOverlay({ onDone }) {
  const [count, setCount] = useState(3);
  const [phase, setPhase] = useState("show"); // show | fade | go | done

  useEffect(() => {
    let t;
    if (phase==="show" && count > 1) {
      t = setTimeout(() => { setPhase("fade"); }, 700);
    } else if (phase==="fade") {
      t = setTimeout(() => { const next=count-1; setCount(next); setPhase(next>=1?"show":"go"); }, 350);
    } else if (phase==="show" && count===1) {
      t = setTimeout(() => setPhase("go"), 700);
    } else if (phase==="go") {
      t = setTimeout(() => { setPhase("done"); onDone(); }, 850);
    }
    return () => clearTimeout(t);
  }, [count, phase]);

  const isGo = phase==="go";
  const opacity = phase==="fade" ? 0 : 1;
  const scale = phase==="fade" ? 1.5 : phase==="show" ? 1 : 1;

  return (
    <div style={{ position:"fixed", inset:0, zIndex:999, background:"rgba(10,9,16,.92)", backdropFilter:"blur(8px)",
      display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:"16px" }}>
      <SBBadge style={{ marginBottom:"8px", fontSize:"13px", padding:"5px 16px" }} />
      <div style={{ fontFamily:"var(--font-d)", fontSize:isGo?"96px":"140px",
        color: isGo?"var(--gold)":"var(--fg)",
        letterSpacing: isGo?"8px":"4px",
        textShadow: isGo?"0 0 40px rgba(251,191,36,.7)":"0 0 30px rgba(139,92,246,.4)",
        opacity, transform:`scale(${scale})`,
        transition:"opacity 0.3s var(--ease), transform 0.3s var(--ease)",
        animation: (phase==="show") ? "countdownPop .4s var(--ease) both" : "none",
        lineHeight:1,
      }}>
        {isGo ? "GO!" : count}
      </div>
      <div style={{ fontFamily:"var(--font-d)", fontSize:"16px", color:"var(--fg3)", letterSpacing:"3px", opacity: isGo?0:0.7, transition:"opacity .3s" }}>
        Get ready...
      </div>
    </div>
  );
}

/* ── MATCH TIMER BAR ───────────────────────────────────────── */
function MatchTimerBar({ matchMs, totalMs=180000 }) {
  const pct = matchMs / totalMs;
  const secs = Math.ceil(matchMs / 1000);
  const mins = Math.floor(secs / 60);
  const s = secs % 60;
  const timeStr = `${mins}:${String(s).padStart(2,"0")}`;
  const urgent = matchMs < 30000;
  const warn = matchMs < 60000;
  const color = urgent ? "var(--red)" : warn ? "var(--warn)" : "var(--teal)";

  return (
    <div style={{ display:"flex", alignItems:"center", gap:"10px", padding:"8px 16px",
      background:"var(--bg2)", border:`1px solid ${urgent?"rgba(239,68,68,.4)":warn?"rgba(251,146,60,.3)":"rgba(45,212,191,.2)"}`,
      borderRadius:"var(--r-full)", boxShadow: urgent?"0 0 12px rgba(239,68,68,.25)":warn?"0 0 8px rgba(251,146,60,.2)":"none",
      animation: urgent ? "timerPulse .6s ease infinite" : "none",
    }}>
      <span style={{ fontSize:"14px" }}>⏱</span>
      <span style={{ fontFamily:"var(--font-m)", fontSize:"22px", fontWeight:700, color, letterSpacing:"2px", minWidth:"52px", textAlign:"center" }}>{timeStr}</span>
      {/* Bar */}
      <div style={{ width:"80px", height:"4px", background:"var(--bg3)", borderRadius:"2px", overflow:"hidden" }}>
        <div style={{ height:"100%", width:`${pct*100}%`, background:color, borderRadius:"2px", transition:"width .5s linear, background .3s" }}></div>
      </div>
    </div>
  );
}

/* ── LIVE LEADERBOARD ──────────────────────────────────────── */
function LiveLeaderboard({ scores, matchMs, compact=false }) {
  const sorted = [...scores].sort((a,b) => b.correct - a.correct || a.wrong - b.wrong);
  const totalMs = 180000;

  if (compact) {
    const me = scores.find(s=>s.name==="Alex") || scores[0];
    const leader = sorted[0];
    return (
      <div style={{ display:"flex", alignItems:"center", gap:"12px", padding:"7px 14px",
        background:"var(--bg2)", border:"1px solid var(--border-s)", borderRadius:"var(--r-full)" }}>
        <span style={{ fontFamily:"var(--font-d)", fontSize:"12px", color:"var(--fg3)", letterSpacing:"1px" }}>You: <span style={{ color:"var(--teal)", fontFamily:"var(--font-m)", fontWeight:700 }}>{me.correct}</span></span>
        <span style={{ color:"var(--fg4)" }}>·</span>
        <span style={{ fontFamily:"var(--font-d)", fontSize:"12px", color:"var(--fg3)", letterSpacing:"1px" }}>Leader: <span style={{ color:"var(--gold)", fontFamily:"var(--font-m)", fontWeight:700 }}>{leader.correct}</span></span>
      </div>
    );
  }

  return (
    <div style={{ background:"var(--bg1)", border:"1px solid var(--border)", borderRadius:"var(--r-lg)", padding:"16px", boxShadow:"var(--shadow)", minWidth:"190px" }}>
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:"14px", paddingBottom:"10px", borderBottom:"1px solid var(--border-s)" }}>
        <span style={{ fontFamily:"var(--font-d)", fontSize:"15px", color:"var(--purple)", letterSpacing:"1px" }}>Live Leaderboard</span>
      </div>
      <div style={{ display:"flex", flexDirection:"column", gap:"6px" }}>
        {sorted.map((p,i) => {
          const isMe = p.name==="Alex";
          const isLeading = i===0;
          return (
            <div key={p.name} style={{ display:"flex", alignItems:"center", gap:"10px",
              padding:"8px 10px", borderRadius:"var(--r-md)",
              background: isMe ? "rgba(139,92,246,.1)" : "var(--bg2)",
              border:`1px solid ${isMe?"var(--purple)":isLeading?"rgba(251,191,36,.25)":"var(--border-s)"}`,
              transition:"all 300ms var(--ease)",
              animation: p.flash ? "slideInRight .3s var(--ease)" : "none",
            }}>
              <span style={{ fontFamily:"var(--font-m)", fontSize:"13px", fontWeight:700,
                color: isLeading?"var(--gold)":"var(--fg3)", minWidth:16, textAlign:"center" }}>
                {i===0?"🥇":i+1}
              </span>
              <span style={{ flex:1, fontSize:"13px", fontWeight:600, color: isMe?"var(--purple-l)":"var(--fg)", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
                {p.name}{isMe?" (You)":""}
              </span>
              <span style={{ fontFamily:"var(--font-m)", fontSize:"17px", fontWeight:700,
                color: isLeading?"var(--gold)":"var(--teal)", letterSpacing:0 }}>
                {p.correct}
              </span>
            </div>
          );
        })}
      </div>
      <div style={{ marginTop:"12px", paddingTop:"10px", borderTop:"1px solid var(--border-s)", fontFamily:"var(--font-d)", fontSize:"10px", color:"var(--fg4)", letterSpacing:"1px", textAlign:"center" }}>
        Correct answers only
      </div>
    </div>
  );
}

/* ── COOLDOWN RING ─────────────────────────────────────────── */
function CooldownRing({ seconds, totalSeconds=5 }) {
  const r = 18, circ = 2*Math.PI*r;
  const pct = seconds / totalSeconds;
  return (
    <div style={{ position:"relative", width:44, height:44 }}>
      <svg width="44" height="44" viewBox="0 0 44 44" style={{ transform:"rotate(-90deg)" }}>
        <circle cx="22" cy="22" r={r} fill="none" stroke="rgba(239,68,68,.2)" strokeWidth="3"/>
        <circle cx="22" cy="22" r={r} fill="none" stroke="var(--red)" strokeWidth="3"
          strokeDasharray={circ} strokeDashoffset={circ*(1-pct)}
          strokeLinecap="round" style={{ transition:"stroke-dashoffset .1s linear" }}/>
      </svg>
      <div style={{ position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",
        fontFamily:"var(--font-m)",fontWeight:700,fontSize:"14px",color:"var(--red)" }}>
        {Math.ceil(seconds)}
      </div>
    </div>
  );
}

/* ── RESPONSIVE HOOK ───────────────────────────────────────── */
function useWindowWidth() {
  const [w, setW] = useState(window.innerWidth);
  useEffect(() => {
    const handler = () => setW(window.innerWidth);
    window.addEventListener("resize", handler);
    return () => window.removeEventListener("resize", handler);
  }, []);
  return w;
}

/* ── SPEED BATTLE QUESTION PAGE ────────────────────────────── */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "questionFontSize": 32,
  "optionFontSize": 20,
  "leaderboardWidth": 268,
  "matchDuration": 60
}/*EDITMODE-END*/;

function SpeedBattlePage({ onMatchEnd }) {
  const windowWidth = useWindowWidth();
  const isMobile = windowWidth < 700;
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [qIdx, setQIdx] = useState(0);
  const [state, setState] = useState("answering"); // answering | cooldown | correct
  const [selected, setSelected] = useState(null);
  const [matchMs, setMatchMs] = useState(180000);
  const [cooldownSecs, setCooldownSecs] = useState(5);
  const [scores, setScores] = useState([
    { name:"Alex", correct:3, wrong:1 },
    { name:"Jordan", correct:5, wrong:0 },
    { name:"Sam", correct:2, wrong:2 },
    { name:"Riley", correct:4, wrong:1 },
  ]);
  const [qCorrect, setQCorrect] = useState(3); // total correct for Alex

  const q = QUESTIONS[qIdx % QUESTIONS.length];

  // Match timer
  useEffect(() => {
    const t = setInterval(() => {
      setMatchMs(p => {
        if (p <= 100) { clearInterval(t); onMatchEnd(scores); return 0; }
        return p - 100;
      });
    }, 100);
    return () => clearInterval(t);
  }, []);

  // Cooldown timer
  useEffect(() => {
    if (state !== "cooldown") return;
    setCooldownSecs(5);
    const t = setInterval(() => {
      setCooldownSecs(s => {
        if (s <= 0.1) { clearInterval(t); advanceQuestion(false); return 0; }
        return s - 0.1;
      });
    }, 100);
    return () => clearInterval(t);
  }, [state, qIdx]);

  // Simulate opponents scoring
  useEffect(() => {
    const t = setInterval(() => {
      setScores(prev => prev.map(p => {
        if (p.name === "Alex") return p;
        if (Math.random() < 0.3) return { ...p, correct: p.correct + 1 };
        return p;
      }));
    }, 3500);
    return () => clearInterval(t);
  }, []);

  function handleAnswer(opt) {
    if (state !== "answering") return;
    setSelected(opt);
    if (opt === q.answer) {
      setState("correct");
      const newCorrect = qCorrect + 1;
      setQCorrect(newCorrect);
      setScores(prev => prev.map(p => p.name==="Alex" ? { ...p, correct:newCorrect } : p));
      setTimeout(() => advanceQuestion(true), 600);
    } else {
      setState("cooldown");
      setScores(prev => prev.map(p => p.name==="Alex" ? { ...p, wrong:p.wrong+1 } : p));
    }
  }

  function advanceQuestion(wasCorrect) {
    setSelected(null);
    setState("answering");
    setQIdx(i => i + 1);
  }

  const locked = state === "cooldown";

  return (
    <div style={{ display:"flex", flexDirection:"column", height:"100vh", overflow:"hidden" }}>
      {/* In-game top bar */}
      <div style={{ height:"var(--nav)", background:"linear-gradient(90deg,rgb(26,24,38),rgb(34,32,48))",
        borderBottom:"1px solid rgba(139,92,246,.2)", display:"flex", alignItems:"center",
        padding:"0 20px", gap:"16px", flexShrink:0, position:"relative", zIndex:100 }}>
        <span style={{ fontFamily:"var(--font-d)", fontSize:"1.5rem", letterSpacing:".15em" }}>
          <span style={{color:"var(--purple)"}}>j</span><span style={{color:"var(--gold)"}}>Duel</span>
        </span>
        <SBBadge />
        <div style={{ flex:1 }} />
        {/* Match timer — centered */}
        <MatchTimerBar matchMs={matchMs} totalMs={tweaks?.matchDuration * 1000 || 180000} />
        <div style={{ flex:1 }} />
        {/* Q counter */}
        <span style={{ fontFamily:"var(--font-m)", fontSize:"12px", color:"var(--fg3)" }}>Q{qIdx+1}</span>
      </div>

      {/* Body */}
      <div style={{ flex:1, overflow:"hidden", padding:"20px", display:"flex", gap:"20px" }}>

        {/* Question column */}
        <div style={{ flex:"1 1 0", minWidth:0, display:"flex", flexDirection:"column", gap:"14px" }}>

          {/* Mobile leaderboard strip */}
          {isMobile && (
            <LiveLeaderboard scores={scores} matchMs={matchMs} compact={true} />
          )}

          {/* Question meta */}
          <div style={{ display:"flex", alignItems:"center", gap:"8px" }}>
            <span style={{ fontFamily:"var(--font-m)", fontSize:"12px", color:"var(--teal)", fontWeight:700 }}>Q{qIdx+1}</span>
            <span style={{ color:"var(--fg4)" }}>·</span>
            <span style={{ fontSize:"12px", color:"var(--fg3)" }}>{q.category}</span>
            {locked && (
              <span style={{ marginLeft:"auto", fontFamily:"var(--font-d)", fontSize:"11px", letterSpacing:"1px",
                color:"var(--red)", background:"rgba(239,68,68,.1)", border:"1px solid rgba(239,68,68,.3)",
                padding:"2px 10px", borderRadius:"var(--r-full)", animation:"timerPulse .8s ease infinite" }}>
                🔒 Locked
              </span>
            )}
            {state==="correct" && (
              <span style={{ marginLeft:"auto", fontFamily:"var(--font-d)", fontSize:"11px", letterSpacing:"1px",
                color:"var(--green)", background:"rgba(34,197,94,.1)", border:"1px solid rgba(34,197,94,.3)",
                padding:"2px 10px", borderRadius:"var(--r-full)" }}>
                ✓ Correct!
              </span>
            )}
          </div>

          {/* Question card */}
          <div style={{ position:"relative", fontSize:`clamp(16px,2vw,${tweaks?.questionFontSize||22}px)`, fontWeight:500, color:"var(--fg)",
            padding:"20px 24px", background:"var(--bg2)", borderRadius:"var(--r-lg)",
            border:`2px solid ${locked?"rgba(239,68,68,.4)":state==="correct"?"rgba(34,197,94,.4)":"var(--border)"}`,
            borderTopColor: locked?"var(--red)":state==="correct"?"var(--green)":"var(--purple)",
            borderTopWidth:3, lineHeight:1.5,
            boxShadow: locked?"0 0 12px rgba(239,68,68,.15)":state==="correct"?"0 0 12px rgba(34,197,94,.15)":"var(--shadow)",
            transition:"all 300ms var(--ease)", animation:"cardSlideUp .4s var(--ease) both",
            flexShrink:0,
          }}>
            {q.text}
            {/* Cooldown ring — top right */}
            {locked && (
              <div style={{ position:"absolute", top:12, right:12, animation:"fadeIn .2s ease" }}>
                <CooldownRing seconds={cooldownSecs} totalSeconds={5} />
              </div>
            )}
          </div>

          {/* Options */}
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"10px", flex:1 }}>
            {q.options.map((opt,i) => {
              const letter = String.fromCharCode(65+i);
              const isSelected = selected===opt;
              const isCorrect = opt===q.answer;
              const isWrongSelected = isSelected && state==="cooldown";
              const isRevealCorrect = state==="cooldown" && isCorrect;
              const isAnswerCorrect = isSelected && state==="correct";

              let bg="var(--bg2)", border="2px solid var(--border)", color="var(--fg)", labelColor="var(--teal)", glow="none";
              if (isRevealCorrect) { bg="rgba(34,197,94,.12)"; border="2px solid var(--green)"; glow="0 0 12px rgba(34,197,94,.25)"; }
              if (isWrongSelected) { bg="rgba(239,68,68,.1)"; border="2px solid var(--red)"; glow="0 0 10px rgba(239,68,68,.2)"; labelColor="var(--red)"; }
              if (isAnswerCorrect) { bg="rgba(34,197,94,.12)"; border="2px solid var(--green)"; glow="0 0 12px rgba(34,197,94,.25)"; labelColor="var(--green)"; }

              return (
                <button key={opt} onClick={()=>handleAnswer(opt)} disabled={locked || state==="correct"}
                  style={{ display:"flex", alignItems:"center", gap:"16px", padding:"0 22px",
                    height:"100%", minHeight:"60px",
                    background:bg, border, borderRadius:"var(--r-md)", cursor:locked?"not-allowed":"pointer",
                    textAlign:"left", width:"100%", color, fontSize:`clamp(14px,1.6vw,${tweaks?.optionFontSize||18}px)`, fontWeight:500,
                    fontFamily:"system-ui,sans-serif", letterSpacing:0, textTransform:"none",
                    boxShadow:glow, transition:"all 200ms var(--ease)",
                    opacity: locked && !isSelected && !isCorrect ? 0.45 : 1,
                  }}
                  onMouseEnter={e=>{ if(!locked&&state==="answering"){e.currentTarget.style.borderColor="var(--purple)";e.currentTarget.style.background="rgba(139,92,246,.08)";e.currentTarget.style.transform="translateY(-2px)";} }}
                  onMouseLeave={e=>{ if(!locked&&state==="answering"){e.currentTarget.style.borderColor="var(--border)";e.currentTarget.style.background="var(--bg2)";e.currentTarget.style.transform="none";} }}>
                  <span style={{ fontFamily:"var(--font-d)", fontSize:`clamp(20px,2.2vw,${(tweaks?.optionFontSize||18)+10}px)`, color:labelColor, minWidth:24, flexShrink:0 }}>{letter}</span>
                  <span style={{ fontFamily:"var(--font-d)", fontSize:`clamp(13px,1.4vw,${tweaks?.optionFontSize||18}px)`, letterSpacing:".5px", color: isRevealCorrect?"var(--green)":isWrongSelected?"var(--red)":"var(--fg)" }}>
                    {opt}
                  </span>
                  {isRevealCorrect && <span style={{ marginLeft:"auto", color:"var(--green)", fontSize:"16px", fontWeight:700 }}>✓</span>}
                  {isWrongSelected && <span style={{ marginLeft:"auto", color:"var(--red)", fontSize:"16px", fontWeight:700 }}>✗</span>}
                </button>
              );
            })}
          </div>

          {/* Cooldown explanation */}
          {locked && (
            <div style={{ padding:"12px 16px", background:"rgba(239,68,68,.07)", border:"1px solid rgba(239,68,68,.2)", borderRadius:"var(--r-md)", animation:"formReveal .3s var(--ease) both", display:"flex", alignItems:"center", gap:"12px" }}>
              <span style={{ fontSize:"20px" }}>⏸</span>
              <div>
                <div style={{ fontFamily:"var(--font-d)", fontSize:"13px", color:"var(--red)", letterSpacing:"1px", marginBottom:"2px" }}>Wrong Answer — Locked for {Math.ceil(cooldownSecs)}s</div>
                <div style={{ fontSize:"12px", color:"var(--fg3)" }}>Moving to next question automatically.</div>
              </div>
            </div>
          )}
        </div>

        {/* Leaderboard column — desktop only */}
        {!isMobile && (
        <div style={{ flex:`0 0 ${tweaks?.leaderboardWidth||260}px`, display:"flex", flexDirection:"column", gap:"12px" }}>
          <LiveLeaderboard scores={scores} matchMs={matchMs} />
        </div>
        )}
      </div>

      {/* Tweaks Panel */}
      <TweaksPanel>
        <TweakSection label="Question" />
        <TweakSlider label="Question font size" value={tweaks?.questionFontSize||22} min={14} max={32} unit="px" onChange={v=>setTweak('questionFontSize',v)} />
        <TweakSlider label="Option font size" value={tweaks?.optionFontSize||18} min={12} max={28} unit="px" onChange={v=>setTweak('optionFontSize',v)} />
        <TweakSection label="Layout" />
        <TweakSlider label="Leaderboard width" value={tweaks?.leaderboardWidth||260} min={180} max={400} unit="px" onChange={v=>setTweak('leaderboardWidth',v)} />
        <TweakSection label="Game" />
        <TweakSlider label="Match duration" value={tweaks?.matchDuration||180} min={60} max={300} unit="s" onChange={v=>setTweak('matchDuration',v)} />
      </TweaksPanel>
    </div>
  );
}

    <div style={{ position:"fixed", inset:0, zIndex:998, background:"rgba(10,9,16,.95)", backdropFilter:"blur(10px)",
      display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:"16px" }}>
      <div style={{ fontFamily:"var(--font-d)", fontSize:"clamp(48px,10vw,100px)", letterSpacing:"4px",
        background:"var(--grad-pt)", WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent", backgroundClip:"text",

      <div style={{ fontFamily:"var(--font-d)", fontSize:"16px", color:"var(--fg3)", letterSpacing:"3px", animation:"fadeIn .4s .5s both" }}>

];

        <SBBadge style={{ marginBottom:"16px", fontSize:"13px" }} />

          background:"linear-gradient(135deg,rgba(139,92,246,.15),rgba(251,191,36,.08))",
          border:"2px solid var(--purple)", borderRadius:"var(--r-lg)", padding:"22px 28px",
          marginBottom:"24px", width:"100%", boxShadow:"var(--glow-p)",

    </div>

}

/* ── APP ───────────────────────────────────────────────────── */

  const [screen, setScreen] = useState("lobby"); // lobby | countdown | battle | timesup | results
  const [finalScores, setFinalScores] = useState(null);

  function handleMatchEnd(scores) {
    setFinalScores(scores);
    setScreen("timesup");
  }

  return (
    <div style={{ minHeight:"100vh" }}>
      {/* Nav only on lobby/results */}
      {(screen==="lobby"||screen==="results") && <Nav onHome={()=>setScreen("lobby")} />}

      {screen==="lobby" && (
        <LobbyPage onStart={()=>setScreen("countdown")} />
      )}

      {screen==="countdown" && (
        <CountdownOverlay onDone={()=>setScreen("battle")} />
      )}

      {screen==="battle" && (
        <SpeedBattlePage onMatchEnd={handleMatchEnd} />
      )}

      {screen==="timesup" && (
        <TimesUpOverlay onDone={()=>setScreen("results")} />
      )}

      {screen==="results" && (
        <>
          <FinalLeaderboard
            scores={finalScores || [
              { name:"Alex", correct:8, wrong:2 },
              { name:"Jordan", correct:11, wrong:1 },
              { name:"Sam", correct:8, wrong:4 },
              { name:"Riley", correct:6, wrong:3 },
            ]}
            onPlayAgain={()=>setScreen("lobby")}
          />
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
